<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Open Immersive Translator</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header><span class="logo" aria-hidden="true">文</span><h1>Open Immersive Translator</h1></header>
<main>
  <div id="connection" class="connection" role="status">Checking local server…</div>
  <label for="language">Translate into</label>
  <select id="language"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="it">Italiano</option><option value="ar">العربية</option><option value="hi">हिन्दी</option></select>
  <button id="translate" class="primary" disabled>Translate this page</button>
  <button id="restore" class="secondary">Restore original</button>
  <p id="status" class="status" aria-live="polite"></p>
  <p id="error" class="error" role="alert"></p>
  <section id="agent-help" class="agent-help" aria-label="Agent setup"><h2>Let your agent set it up</h2><button id="copy-agent" class="secondary">Copy for your agent</button><p id="agent-copy-status" role="status" aria-live="polite"></p><details id="agent-preview"><summary>View agent request</summary><textarea id="agent-prompt" aria-label="Website setup request for your agent" readonly rows="7"></textarea></details></section>
  <div class="links"><button id="reader" class="text-button">Documents ↗</button><button id="settings" class="text-button">Settings</button></div>
</main><script src="popup.js"></script></body></html>
